services:
  - type: web
    name: resumeai-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false        # paste your key in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FALLBACK_TO_MOCK
        value: "true"
      - key: MAX_FILE_SIZE_MB
        value: "5"
      - key: ALLOWED_ORIGINS
        sync: false        # your Vercel URL, e.g. https://resumeai.vercel.app
